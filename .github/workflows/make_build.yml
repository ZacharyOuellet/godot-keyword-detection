# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is triggered manually on the "Actions" tab on GitHub, and can be used to create releases.

name: Make a GDExtension build for all supported platforms
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A build is made for every possible combination of parameters
        # You can add or remove entries from the arrays of each parameter to customize which builds you want to run.
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 , runner: ["self-hosted", "linux"]},
            { platform: linux, arch: x86_32, os: ubuntu-22.04 , runner: ["self-hosted", "linux"] },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm ,runner: ["self-hosted", "linux"]},
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm, runner: ["self-hosted", "linux"] },
            { platform: windows, arch: x86_64, os: windows-latest, runner: ["self-hosted", "windows"] },
            { platform: windows, arch: x86_32, os: windows-latest, runner: ["self-hosted", "windows"] },
            { platform: windows, arch: arm64, os: windows-latest, runner: ["self-hosted", "windows"] },
            { platform: macos, arch: universal, os: macos-latest, runner: macos-latest },
            { platform: android, arch: x86_64, os: ubuntu-22.04, runner: ["self-hosted", "linux"] },
            { platform: android, arch: x86_32, os: ubuntu-22.04, runner: ["self-hosted", "linux"] },
            { platform: android, arch: arm64, os: ubuntu-22.04, runner: ["self-hosted", "linux"] },
            { platform: android, arch: arm32, os: ubuntu-22.04, runner: ["self-hosted", "linux"] },
            { platform: ios, arch: arm64, os: macos-latest, runner: macos-latest },
            { platform: web, arch: wasm32, os: ubuntu-22.04, runner: ["self-hosted", "linux"] },
          ]
        target-type: [template_debug, template_release]
        float-precision: [single]

    runs-on: ${{ matrix.target.runner }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Linux cross-compilation toolchains
        if: ${{ matrix.target.platform == 'linux' && (matrix.target.arch == 'arm64' || matrix.target.arch == 'arm32') }}
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure cross-compiler shims for Linux ARM64
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'arm64' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.local/cross-shims"
          ln -sf /usr/bin/aarch64-linux-gnu-gcc  "$HOME/.local/cross-shims/gcc"
          ln -sf /usr/bin/aarch64-linux-gnu-g++  "$HOME/.local/cross-shims/g++"
          ln -sf /usr/bin/aarch64-linux-gnu-ar   "$HOME/.local/cross-shims/ar"
          ln -sf /usr/bin/aarch64-linux-gnu-strip "$HOME/.local/cross-shims/strip"
          echo "$HOME/.local/cross-shims" >> "$GITHUB_PATH"

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62
          windows-compiler: msvc

      - name: Fix python3 for emcc on self-hosted
        if: ${{ matrix.target.platform == 'web' && contains(join(matrix.target.runner, ','), 'self-hosted') }}
        shell: bash
        run: |
          mkdir -p "$HOME/.local/shims"
          ln -sf /usr/bin/python3 "$HOME/.local/shims/python3"
          echo "$HOME/.local/shims" >> "$GITHUB_PATH"

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} ${SCONS_EXTRA:-}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      # Upload the build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-mfcc-dtw-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/bin/**

  # Merges all the build artifacts together into a single godot-mfcc-dtw artifact.
  # If you comment out this step, all the builds will be uploaded individually.
  merge:
    runs-on: ["self-hosted", "linux"]
    needs: build
    if: ${{ always()}}
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: godot-mfcc-dtw
          pattern: godot-mfcc-dtw-*
          delete-merged: true
